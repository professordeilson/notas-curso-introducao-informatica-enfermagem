<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Notas – Informática na Enfermagem</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="icone">🩺</div>
    <h1>Consulta de Notas</h1>

    <div class="info">
      <div><strong>Matéria:</strong> Introdução à Informática na Enfermagem</div>
      <div><strong>Professor:</strong> Deilson Aquino</div>
    </div>

    <form id="formConsulta">
      <label for="matricula">Insira sua Matrícula:</label>
      <div class="linha">
        <input type="text" id="matricula" inputmode="numeric" autocomplete="off" placeholder="Ex.: 12345" required>
        <button type="submit">Consultar</button>
      </div>
    </form>

    <div id="resultado" aria-live="polite"></div>
    <p class="rodape">Cursos Progressão</p>
  </main>

<script src="script.js"></script>
</body>
</html>
